name: Fetch Free Node Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  fetch-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and inspect sources
        run: |
          python src/fetch_sources.py

      - name: Merge and deduplicate nodes
        run: |
          python src/merge_nodes.py

      - name: Download Mihomo
        run: |
          mkdir -p bin

          curl -fL \
            -o bin/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v3-v1.19.31.gz

          gunzip -f bin/mihomo.gz
          chmod +x bin/mihomo

          ./bin/mihomo -v

      - name: Test all nodes
        run: |
          python src/test_nodes.py

      - name: Select YouTube-passing free nodes
        run: |
          python src/select_nodes.py

      - name: Analyze duplicates
        run: |
          python src/analyze_duplicates.py

      - name: Analyze duplicate differences
        run: |
          python src/analyze_duplicate_differences.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: free-node-results
          path: |
            data/test-results.json
            data/free-nodes.yaml

      - name: Publish free-nodes.yaml
        run: |
          cp data/free-nodes.yaml free-nodes.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add free-nodes.yaml

          git diff --cached --quiet || git commit -m "Update free nodes"

          git push

      - name: Keep only the latest 3 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_IDS=$(gh run list \
            --workflow="${{ github.workflow }}" \
            --limit 100 \
            --json databaseId \
            --jq '.[3:] | .[].databaseId')

          for RUN_ID in $RUN_IDS; do
            echo "Deleting workflow run: $RUN_ID"
            gh run delete "$RUN_ID" --repo "${{ github.repository }}" --confirm
          done
